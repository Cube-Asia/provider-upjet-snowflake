name: Publish Provider Package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version string to use while publishing the package (e.g. v1.0.0-alpha.1)"
        default: ""
        required: false
      go-version:
        description: "Go version to use if building needs to be done"
        default: "1.26.5"
        required: false

env:
  DOCKER_BUILDX_VERSION: "v0.34.1"
  REGISTRY_ORG: cube-asia
  CROSSPLANE_REGORG: ghcr.io/cube-asia
  MIRROR_REGISTRY: xpkg.upbound.io
  MIRROR_REGORG: xpkg.upbound.io/cube-asia
  REPOSITORY: provider-snowflake
  VERSION: ${{ github.event.inputs.version || github.ref_name }}
  GO_VERSION: ${{ github.event.inputs.go-version || '1.26.5' }}

jobs:
  authorize:
    runs-on: ubuntu-24.04
    environment: release
    steps:
      - name: Reject non-release refs
        if: github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "::error::Publish must run from main or a vX.Y.Z tag, got ${{ github.ref }}"
          exit 1

  # Forked from crossplane-contrib/provider-workflows@451c4dc (publish-provider.yml).
  # We inline it (instead of `uses:`) so every job that needs the mirror
  # secrets can declare `environment: release` itself -- a reusable workflow
  # job's OWN jobs don't inherit `environment:` from the caller, so
  # environment-scoped secrets (XPKG_MIRROR_TOKEN/XPKG_MIRROR_ACCESS_ID) were
  # silently empty when referenced only in the caller's `secrets:` block.
  publish-artifacts:
    needs: authorize
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      packages: write
    steps:
      - name: Setup QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: all

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          version: ${{ env.DOCKER_BUILDX_VERSION }}
          install: true

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout ${{ github.repository }} ${{ env.VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Fetch History
        run: git fetch --prune --unshallow

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Find the Go Build Cache
        id: go_cache
        run: |
          echo "cache=$(make go.cachedir)" >> "$GITHUB_OUTPUT"
          echo "mod_cache=$(make go.mod.cachedir)" >> "$GITHUB_OUTPUT"

      - name: Cache the Go Build Cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.go_cache.outputs.cache }}
          key: ${{ runner.os }}-build-publish-artifacts-${{ hashFiles('**/go.sum') }}
          restore-keys: ${{ runner.os }}-build-publish-artifacts-

      - name: Cache Go Dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.go_cache.outputs.mod_cache }}
          key: ${{ runner.os }}-pkg-${{ hashFiles('**/go.sum') }}
          restore-keys: ${{ runner.os }}-pkg-

      - name: Vendor Dependencies
        run: make vendor vendor.check

      - name: Build Artifacts
        env:
          # docker buildx doesn't load images it builds by default; --load does.
          BUILD_ARGS: "--load"
        run: |
          make -j XPKG_REG_ORGS="${{ env.CROSSPLANE_REGORG }}" XPKG_REG_ORGS_NO_PROMOTE="${{ env.CROSSPLANE_REGORG }}" BRANCH_NAME="main" ${{ env.VERSION != '' && format('VERSION={0}', env.VERSION) || '' }} build.all

      - name: Publish Artifacts
        run: |
          make -j XPKG_REG_ORGS="${{ env.CROSSPLANE_REGORG }}" XPKG_REG_ORGS_NO_PROMOTE="${{ env.CROSSPLANE_REGORG }}" BRANCH_NAME="main" ${{ env.VERSION != '' && format('VERSION={0}', env.VERSION) || '' }} publish

  mirror-to-upbound:
    needs: publish-artifacts
    runs-on: ubuntu-24.04
    environment: release
    steps:
      - name: Setup crane
        uses: imjasonh/setup-crane@feee3b6bb0d4c68370f256a4502498c9227e5c6b # v0.7

      - name: Login to Upbound Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.MIRROR_REGISTRY }}
          username: ${{ secrets.XPKG_MIRROR_ACCESS_ID }}
          password: ${{ secrets.XPKG_MIRROR_TOKEN }}

      - name: Mirror to ${{ env.MIRROR_REGISTRY }}
        run: |
          crane copy "${{ env.CROSSPLANE_REGORG }}/${{ env.REPOSITORY }}:${{ env.VERSION }}" "${{ env.MIRROR_REGORG }}/${{ env.REPOSITORY }}:${{ env.VERSION }}" --allow-nondistributable-artifacts
