apiVersion: stable.snowflake.m.crossplane.io/v1alpha1
kind: Association
metadata:
  annotations:
    meta.upbound.io/example-id: stable/v1alpha1/association
  labels:
    testing.upbound.io/example-name: db_association
  name: db-association
  namespace: crossplane-system
spec:
  forProvider:
    objectIdentifiers:
    - ${snowflake_database.test.fully_qualified_name}
    objectType: DATABASE
    tagId: ${snowflake_tag.test.fully_qualified_name}
    tagValue: finance

---

apiVersion: stable.snowflake.m.crossplane.io/v1alpha1
kind: Database
metadata:
  annotations:
    meta.upbound.io/example-id: stable/v1alpha1/association
  labels:
    testing.upbound.io/example-name: test
  name: test
  namespace: crossplane-system
spec:
  forProvider: {}

---

apiVersion: stable.snowflake.m.crossplane.io/v1alpha1
kind: Schema
metadata:
  annotations:
    meta.upbound.io/example-id: stable/v1alpha1/association
  labels:
    testing.upbound.io/example-name: test
  name: test
  namespace: crossplane-system
spec:
  forProvider:
    database: database

---

apiVersion: preview.snowflake.m.crossplane.io/v1alpha1
kind: Table
metadata:
  annotations:
    meta.upbound.io/example-id: stable/v1alpha1/association
  labels:
    testing.upbound.io/example-name: test
  name: test
  namespace: crossplane-system
spec:
  forProvider:
    column:
    - name: column1
      type: VARIANT
    - name: column2
      type: VARCHAR(16)
    comment: Terraform example table
    database: database
    schema: schema

---

apiVersion: stable.snowflake.m.crossplane.io/v1alpha1
kind: Tag
metadata:
  annotations:
    meta.upbound.io/example-id: stable/v1alpha1/association
  labels:
    testing.upbound.io/example-name: test
  name: test
  namespace: crossplane-system
spec:
  forProvider:
    allowedValues:
    - finance
    - engineering
    database: database
    schema: schema
