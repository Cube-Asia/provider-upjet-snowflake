apiVersion: userpreview.snowflake.crossplane.io/v1alpha1
kind: AuthenticationPolicyAttachment
metadata:
  annotations:
    meta.upbound.io/example-id: userpreview/v1alpha1/authenticationpolicyattachment
  labels:
    testing.upbound.io/example-name: apa
  name: apa
spec:
  forProvider:
    authenticationPolicyName: ${snowflake_authentication_policy.ap.fully_qualified_name}
    userName: ${snowflake_user.user.name}

---

apiVersion: user.snowflake.crossplane.io/v1alpha1
kind: User
metadata:
  annotations:
    meta.upbound.io/example-id: userpreview/v1alpha1/authenticationpolicyattachment
  labels:
    testing.upbound.io/example-name: user
  name: user
spec:
  forProvider: {}
