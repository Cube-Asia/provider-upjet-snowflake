apiVersion: userpreview.snowflake.crossplane.io/v1alpha1
kind: PasswordPolicyAttachment
metadata:
  annotations:
    meta.upbound.io/example-id: userpreview/v1alpha1/passwordpolicyattachment
  labels:
    testing.upbound.io/example-name: ppa
  name: ppa
spec:
  forProvider:
    passwordPolicyName: ${snowflake_password_policy.pp.fully_qualified_name}
    userName: ${snowflake_user.user.name}

