apiVersion: preview.snowflake.crossplane.io/v1alpha1
kind: Scala
metadata:
  annotations:
    meta.upbound.io/example-id: preview/v1alpha1/scala
  labels:
    testing.upbound.io/example-name: minimal
  name: minimal
spec:
  forProvider:
    arguments:
    - argDataType: VARCHAR(100)
      argName: x
    database: ${snowflake_database.test.name}
    functionDefinition: |2
        class TestFunc {
          def echoVarchar(x : String): String = {
            return x
          }
        }
    handler: TestFunc.echoVarchar
    name: my_scala_function
    returnType: VARCHAR(100)
    runtimeVersion: "2.12"
    schema: ${snowflake_schema.test.name}
