apiVersion: preview.snowflake.crossplane.io/v1alpha1
kind: IntegrationGitRepositoryOauth2
metadata:
  annotations:
    meta.upbound.io/example-id: preview/v1alpha1/integrationgitrepositoryoauth2
  labels:
    testing.upbound.io/example-name: basic
  name: basic
spec:
  forProvider:
    apiAllowedPrefixes:
    - https://gitlab.com/my-org/
    enabled: true
    oauthAuthorizationEndpoint: https://gitlab.com/oauth/authorize
    oauthClientId: my-client-id
    oauthClientSecretSecretRef:
      key: example-key
      name: example-secret
      namespace: upbound-system
    oauthTokenEndpoint: https://gitlab.com/oauth/token
