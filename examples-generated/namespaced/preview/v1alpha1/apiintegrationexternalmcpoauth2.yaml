apiVersion: preview.snowflake.m.crossplane.io/v1alpha1
kind: ApiIntegrationExternalMcpOauth2
metadata:
  annotations:
    meta.upbound.io/example-id: preview/v1alpha1/apiintegrationexternalmcpoauth2
  labels:
    testing.upbound.io/example-name: basic
  name: basic
  namespace: crossplane-system
spec:
  forProvider:
    apiAllowedPrefixes:
    - https://mcp-server.example.com/
    enabled: true
    oauthAuthorizationEndpoint: https://mcp-server.example.com/oauth/authorize
    oauthClientId: my-client-id
    oauthClientSecretSecretRef:
      key: example-key
      name: example-secret
    oauthTokenEndpoint: https://mcp-server.example.com/oauth/token
