apiVersion: preview.snowflake.m.crossplane.io/v1alpha1
kind: UserPasswordPolicyAttachment
metadata:
  annotations:
    meta.upbound.io/example-id: preview/v1alpha1/userpasswordpolicyattachment
  labels:
    testing.upbound.io/example-name: ppa
  name: ppa
  namespace: crossplane-system
spec:
  forProvider:
    passwordPolicyName: ${snowflake_password_policy.pp.fully_qualified_name}

---

apiVersion: stable.snowflake.m.crossplane.io/v1alpha1
kind: PasswordPolicy
metadata:
  annotations:
    meta.upbound.io/example-id: preview/v1alpha1/userpasswordpolicyattachment
  labels:
    testing.upbound.io/example-name: pp
  name: pp
  namespace: crossplane-system
spec:
  forProvider:
    database: prod
    schema: security

---

apiVersion: stable.snowflake.m.crossplane.io/v1alpha1
kind: User
metadata:
