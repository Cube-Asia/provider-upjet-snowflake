apiVersion: preview.snowflake.m.crossplane.io/v1alpha1
kind: Table
metadata:
  annotations:
    meta.upbound.io/example-id: preview/v1alpha1/table
  labels:
    testing.upbound.io/example-name: table
  name: table
  namespace: crossplane-system
spec:
  forProvider:
    changeTracking: false
    clusterBy:
    - to_date(DATE)
    column:
    - default:
      - sequence: ${snowflake_sequence.sequence.fully_qualified_name}
      name: id
      nullable: true
      type: int
    - identity:
      - startNum: 1
        stepNum: 3
      name: identity
      nullable: true
      type: NUMBER(38,0)
    - collate: en-ci
      name: data
      nullable: false
      type: text
    - name: DATE
      type: TIMESTAMP_NTZ(9)
    - comment: extra data
      name: extra
      type: VARIANT
    comment: A table.
    dataRetentionTimeInDays: ${snowflake_schema.schema.data_retention_time_in_days}
    database: database_name
    schema: ${snowflake_schema.schema.name}

---

apiVersion: stable.snowflake.m.crossplane.io/v1alpha1
kind: Schema
metadata:
  annotations:
    meta.upbound.io/example-id: preview/v1alpha1/table
  labels:
    testing.upbound.io/example-name: schema
  name: schema
  namespace: crossplane-system
spec:
  forProvider:
    data_retention_days: 1
    database: database

---

apiVersion: preview.snowflake.m.crossplane.io/v1alpha1
kind: Sequence
metadata:
  annotations:
    meta.upbound.io/example-id: preview/v1alpha1/table
  labels:
    testing.upbound.io/example-name: sequence
  name: sequence
  namespace: crossplane-system
spec:
  forProvider:
    database: database
    schema: schema
