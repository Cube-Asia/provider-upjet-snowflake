apiVersion: stable.snowflake.crossplane.io/v1alpha1
kind: CatalogIntegrationIcebergRest
metadata:
  annotations:
    meta.upbound.io/example-id: stable/v1alpha1/catalogintegrationicebergrest
  labels:
    testing.upbound.io/example-name: oauth_basic
  name: oauth-basic
spec:
  forProvider:
    enabled: false
    oauthRestAuthentication:
    - oauthAllowedScopes:
      - PRINCIPAL_ROLE:ALL
      oauthClientIdSecretRef:
        key: example-key
        name: example-secret
        namespace: upbound-system
      oauthClientSecretSecretRef:
        key: example-key
        name: example-secret
        namespace: upbound-system
    restConfig:
    - catalogUri: https://your-iceberg-rest.example.com
