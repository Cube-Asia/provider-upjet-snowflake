apiVersion: stable.snowflake.crossplane.io/v1alpha1
kind: GrantPrivilegesToDatabaseRole
metadata:
  annotations:
    meta.upbound.io/example-id: stable/v1alpha1/grantprivilegestodatabaserole
  labels:
    testing.upbound.io/example-name: example
  name: example
spec:
  forProvider:
    databaseRoleName: ${snowflake_database_role.db_role.fully_qualified_name}
    onDatabase: ${snowflake_database.test_database.fully_qualified_name}
    privileges:
    - CREATE
    - MONITOR

---

apiVersion: stable.snowflake.crossplane.io/v1alpha1
kind: Database
metadata:
  annotations:
    meta.upbound.io/example-id: stable/v1alpha1/grantprivilegestodatabaserole
  labels:
    testing.upbound.io/example-name: db
  name: db
spec:
  forProvider: {}

---

apiVersion: stable.snowflake.crossplane.io/v1alpha1
kind: DatabaseRole
metadata:
  annotations:
    meta.upbound.io/example-id: stable/v1alpha1/grantprivilegestodatabaserole
  labels:
    testing.upbound.io/example-name: db_role
  name: db-role
spec:
  forProvider:
    database: database

---

apiVersion: stable.snowflake.crossplane.io/v1alpha1
kind: Schema
metadata:
  annotations:
    meta.upbound.io/example-id: stable/v1alpha1/grantprivilegestodatabaserole
  labels:
    testing.upbound.io/example-name: my_schema
  name: my-schema
spec:
  forProvider:
    database: database
