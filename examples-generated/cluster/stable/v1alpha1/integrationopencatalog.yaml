apiVersion: stable.snowflake.crossplane.io/v1alpha1
kind: IntegrationOpenCatalog
metadata:
  annotations:
    meta.upbound.io/example-id: stable/v1alpha1/integrationopencatalog
  labels:
    testing.upbound.io/example-name: basic
  name: basic
spec:
  forProvider:
    enabled: false
    restAuthentication:
    - oauthAllowedScopes:
      - PRINCIPAL_ROLE:ALL
      oauthClientIdSecretRef:
        key: example-key
        name: example-secret
        namespace: upbound-system
      oauthClientSecretSecretRef:
        key: example-key
        name: example-secret
        namespace: upbound-system
    restConfig:
    - catalogName: my_catalog
      catalogUri: https://your-org.snowflakecomputing.com/polaris/api/catalog
