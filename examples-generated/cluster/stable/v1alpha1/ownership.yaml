apiVersion: stable.snowflake.crossplane.io/v1alpha1
kind: Ownership
metadata:
  annotations:
    meta.upbound.io/example-id: stable/v1alpha1/ownership
  labels:
    testing.upbound.io/example-name: test
  name: test
spec:
  forProvider:
    accountRoleName: ${snowflake_role.test.name}
    "on":
    - objectName: '"${snowflake_database.test.name}"."${snowflake_schema.test.name}"'
      objectType: SCHEMA
    outboundPrivileges: COPY

---

apiVersion: stable.snowflake.crossplane.io/v1alpha1
kind: AccountRole
metadata:
  annotations:
    meta.upbound.io/example-id: stable/v1alpha1/ownership
  labels:
    testing.upbound.io/example-name: test
  name: test
spec:
  forProvider: {}

---

apiVersion: stable.snowflake.crossplane.io/v1alpha1
kind: Database
metadata:
  annotations:
    meta.upbound.io/example-id: stable/v1alpha1/ownership
  labels:
    testing.upbound.io/example-name: test
  name: test
spec:
  forProvider: {}

---

apiVersion: stable.snowflake.crossplane.io/v1alpha1
kind: Role
metadata:
  annotations:
    meta.upbound.io/example-id: stable/v1alpha1/ownership
  labels:
    testing.upbound.io/example-name: test
  name: test
spec:
  forProvider:
    database: database

---

apiVersion: stable.snowflake.crossplane.io/v1alpha1
kind: GrantAccountRole
metadata:
  annotations:
    meta.upbound.io/example-id: stable/v1alpha1/ownership
  labels:
    testing.upbound.io/example-name: test
  name: test
spec:
  forProvider:
    userName: username

---

apiVersion: stable.snowflake.crossplane.io/v1alpha1
kind: Schema
metadata:
  annotations:
    meta.upbound.io/example-id: stable/v1alpha1/ownership
  labels:
    testing.upbound.io/example-name: test
  name: test
spec:
  forProvider:
    database: database
    provider: ${snowflake.secondary}
